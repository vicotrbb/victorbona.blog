<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="title description">
  <title id="title">Bounding-box candidates and polygon coverage</title>
  <desc id="description">An L-shaped polygon sits inside a dashed bounding box. A is in the interior, B is in the empty part of the bounding box, C is on the polygon boundary, and D is outside the box.</desc>
  <rect width="760" height="380" rx="8" fill="#f8fafc"/>
  <g font-family="system-ui, sans-serif" fill="#172033">
    <text x="32" y="36" font-size="18" font-weight="650">A candidate still needs a geometry check</text>
    <rect x="48" y="68" width="252" height="252" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5"/>
    <path d="M48 68H300V148H138V320H48Z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.5"/>
    <g fill="#172033" stroke="#f8fafc" stroke-width="2">
      <circle cx="95" cy="111" r="6"/>
      <circle cx="245" cy="249" r="6"/>
      <circle cx="138" cy="232" r="6"/>
      <circle cx="353" cy="191" r="6"/>
    </g>
    <g font-size="17" font-weight="700">
      <text x="106" y="105">A</text><text x="257" y="245">B</text>
      <text x="150" y="225">C</text><text x="365" y="187">D</text>
    </g>
    <g font-size="16">
      <text x="422" y="99" font-weight="650">A · Polygon interior</text>
      <text x="422" y="123" fill="#475569">Candidate, then match</text>
      <text x="422" y="163" font-weight="650">B · Inside the box only</text>
      <text x="422" y="187" fill="#475569">Candidate, then rejected</text>
      <text x="422" y="227" font-weight="650">C · Polygon boundary</text>
      <text x="422" y="251" fill="#475569">Matches with ST_Covers</text>
      <text x="422" y="291" font-weight="650">D · Outside the box</text>
      <text x="422" y="315" fill="#475569">Rejected by the broad phase</text>
    </g>
    <text x="48" y="351" font-size="13" fill="#475569">Schematic planar geometry. Dashed line: bounding box. Blue: polygon.</text>
  </g>
</svg>
