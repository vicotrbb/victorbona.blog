<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="title description">
  <title id="title">Calculated internal backlog during slowdown and recovery</title>
  <desc id="description">With 1000 arrivals per second and 600 completions per second for 30 seconds, an unbounded queue grows to 12000 records. At 1400 completions per second it drains by 60 seconds. A queue capped at 2000 pauses admission, then drains by 35 seconds.</desc>
  <rect width="760" height="400" rx="8" fill="#f8fafc"/>
  <g font-family="system-ui, sans-serif" fill="#172033">
    <text x="28" y="32" font-size="18" font-weight="650">Internal queue during a slow sink</text>
    <text x="28" y="55" font-size="13" fill="#475569">Idealized rate model. Pausable source. Active work excluded.</text>
    <rect x="85" y="90" width="300" height="216" fill="#e2e8f0" opacity="0.55"/>
    <g stroke="#cbd5e1" stroke-width="1">
      <path d="M85 90H685M85 162H685M85 234H685M85 306H685"/>
    </g>
    <g font-size="12" fill="#475569" text-anchor="end">
      <text x="73" y="94">12,000</text><text x="73" y="166">8,000</text>
      <text x="73" y="238">4,000</text><text x="73" y="310">0</text>
    </g>
    <g font-size="12" fill="#475569" text-anchor="middle">
      <text x="85" y="325">0</text><text x="185" y="325">10</text><text x="285" y="325">20</text>
      <text x="385" y="325">30</text><text x="485" y="325">40</text><text x="585" y="325">50</text><text x="685" y="325">60</text>
    </g>
    <path d="M85 90V306H685" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <path d="M385 90V306" stroke="#64748b" stroke-dasharray="4 4"/>
    <path d="M85 306L385 90L685 306" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="8 5"/>
    <path d="M85 306L135 270H385L435 306H685" fill="none" stroke="#1d4ed8" stroke-width="3"/>
    <text x="190" y="113" font-size="13">Sink: 600 records/s</text>
    <text x="458" y="113" font-size="13">Sink: 1,400 records/s</text>
    <text x="155" y="260" font-size="13" fill="#1d4ed8">Admission pauses at 2,000</text>
    <text x="385" y="347" text-anchor="middle" font-size="13" fill="#475569">Elapsed time (seconds)</text>
    <path d="M87 374H125" stroke="#64748b" stroke-width="3" stroke-dasharray="8 5"/>
    <text x="135" y="378" font-size="13">Unbounded admission</text>
    <path d="M386 374H424" stroke="#1d4ed8" stroke-width="3"/>
    <text x="434" y="378" font-size="13">Bounded admission</text>
    <text x="85" y="79" font-size="12" fill="#475569">Queued records</text>
  </g>
</svg>
